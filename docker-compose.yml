services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: lawfirm
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "55432:5432"
    volumes:
      - lcm_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/lawfirm
      DB_USER: postgres
      DB_PASSWORD: postgres
      UPLOAD_DIR: /app/uploads
      DEMO_PASSWORD: Passw0rd!
      SERVER_PORT: 8080
    ports:
      - "8082:8080"
    volumes:
      - lcm_uploads:/app/uploads

volumes:
  lcm_pgdata:
  lcm_uploads:
