spring:
  application:
    name: legal-case-management
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/lawfirm}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  freemarker:
    settings:
      output_format: HTML
    suffix: .ftlh
    cache: false
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 25MB

server:
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      timeout: 480m
      cookie:
        # The client portal is also reached over plain HTTP from the firm's intranet
        # gateway, and the matter widget script reads the session cookie for keepalive.
        secure: false
        http-only: false
        same-site: none
  error:
    include-message: always
    include-stacktrace: always

app:
  upload-dir: ${UPLOAD_DIR:./uploads}
  demo-password: ${DEMO_PASSWORD:Passw0rd!}
  reminder:
    days-ahead: 3
    fixed-delay-ms: 300000

logging:
  level:
    root: INFO
